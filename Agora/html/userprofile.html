<!doctype html>
<html lang="en">
  <head>
    <title>User Profile</title>
    <meta charset="utf-8">
    <link href="../dist/output.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <nav class="flex flex-wrap justify-between items-center bg-gray-200 p-4">
      <div class="flex flex-wrap items-center space-x-8">
        <img src="../images/agoralogo.png" alt="Agora Logo" class="w-[150px] md:w-[200px] h-[150px] md:h-[200px] object-cover rounded-full">
        <ul class="flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-8">
          <li><a href="index.html" class="flex items-center justify-center w-32 md:w-40 h-12 px-4 py-2 bg-white rounded-md">Home</a></li>
          <li><a href="shop.html" class="flex items-center justify-center w-32 md:w-40 h-12 px-4 py-2 bg-white rounded-md">Shop</a></li>
          <li><a href="myaccount.html" class="flex items-center justify-center w-32 md:w-40 h-12 px-4 py-2 bg-white rounded-md">My Account</a></li>
          <li><a href="cart.html"><img src="../images/cart.png" alt="Cart" class="w-[45px] md:w-[55px] h-auto"></a></li>
        </ul>
      </div>
      <div class="flex items-center space-x-4 mt-4 md:mt-0">
        <button class="px-4 py-2 border bg-white border rounded-md"><a href="register.html">Register</a></button>
        <button id="loginLogoutButton" class="px-4 py-2 border bg-white border rounded-md"><a href="login.html">Login</a></button>
      </div>
    </nav>

    <main class="min-h-screen flex flex-col items-center mt-4 bg-gray-50">
        <div class="text-center w-full">
            <h1 class="text-4xl font-bold mb-6 text-center">Profile</h1>
        </div>
        <div id="manageProfileForm" class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg mx-auto relative" style="max-height: 600px; overflow-y: auto;">
            <button id="closeProfileForm" class="absolute top-2 right-4 text-gray-500 text-2xl font-bold">&times;</button>
            <form id="profileForm" action="../userProfile.php" method="POST" class="space-y-4">
                <div>
                    <label for="fullName" class="block text-lg font-medium">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                </div>
                <div>
                    <label for="email" class="block text-lg font-medium">Email:</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                </div>
                <div>
                    <label for="role" class="block text-lg font-medium">Role:</label>
                    <input type="text" id="role" name="role" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                </div>
                <div>
                    <label for="location" class="block text-lg font-medium">Location:</label>
                    <input type="text" id="location" name="location" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                </div>
                <div>
                    <label for="Business" class="block text-lg font-medium">Business:</label>
                    <input type="text" id="Business" name="Business" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="editButton" class="px-4 py-2 bg-blue-500 text-white rounded-md hidden">Edit Profile</button>
                    <button type="submit" id="saveButton" class="px-4 py-2 bg-blue-500 text-white rounded-md hidden">Save</button>
                    <button type="button" class="px-4 py-2 bg-gray-400 text-white rounded-md hidden" id="cancelButton">Cancel</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="p-6 md:p-8 bg-gray-700 text-white mt-8">
      <div class="flex flex-col md:flex-row items-center md:items-start space-y-4 md:space-y-0 md:space-x-8">
        <img src="../images/agoralogo.png" alt="Agora Logo" class="w-[100px] md:w-[150px] h-[100px] md:h-[150px] object-cover rounded-full">
        <ul class="flex flex-col space-y-4 md:space-y-4">
          <li><a href="index.html" class="hover:text-blue-400">Home</a></li>
          <li><a href="#" class="hover:text-blue-400">Shop</a></li>
          <li><a href="#" class="hover:text-blue-400">My Account</a></li>
        </ul>
      </div>
      <div class="flex flex-col md:flex-row justify-between items-center py-4 mt-8">
        <p>© 2024 Agora Limited</p>
        <ul class="flex space-x-4">
          <li><a href="#" class="hover:text-blue-400">About Us</a></li>
          <li><a href="#" class="hover:text-blue-400">Careers</a></li>
          <li><a href="#" class="hover:text-blue-400">Advertise</a></li>
          <li><a href="#" class="hover:text-blue-400">Privacy Policy</a></li>
          <li><a href="#" class="hover:text-blue-400">Terms & Conditions</a></li>
          <li><a href="#" class="hover:text-blue-400">Contact Us</a></li>
        </ul>
      </div>
    </footer>
    <script >
        let isCurrentUser = false;
    
        // Check login status and update login/logout button
        fetch('../session.php')
            .then(response => response.json())
            .then(data => {
                const loginLogoutButton = document.getElementById('loginLogoutButton');
                if (data.loggedIn) {
                    loginLogoutButton.innerHTML = '<a href="../logout.php">Logout</a>';
                    isCurrentUser = data.userID === data.profileUserID;
                } else {
                    loginLogoutButton.innerHTML = '<a href="login.html">Login</a>';
                }
            })
            .catch(error => console.error('Error fetching login status:', error));
        
        function loadProfileData() {
    
        // Handles getting the user details.
        fetch('../userProfile.php')
            .then(response => response.json())
            .then(data => {
                if (!data.error) {
                    document.getElementById('fullName').value = data.fullName;
                    document.getElementById('email').value = data.email;
                    document.getElementById('role').value = data.role;
                    document.getElementById('location').value = data.location;
                    document.getElementById('Business').value = data.business || 'N/A';
    
                    if (isCurrentUser) {
                        document.getElementById('editButton').classList.remove('hidden');
                    }
                } else {
                    console.error(data.error);
                }
            })
            .catch(error => console.error('Error fetching profile data:', error));
        }
    
    document.addEventListener('DOMContentLoaded', loadProfileData);
    
    document.getElementById('editButton').addEventListener('click', () => {
        document.getElementById('fullName').readOnly = false;
        document.getElementById('email').readOnly = false;
        document.getElementById('role').readOnly = false;
        document.getElementById('location').readOnly = false;
        document.getElementById('saveButton').classList.remove('hidden');
        document.getElementById('cancelButton').classList.remove('hidden');
        document.getElementById('editButton').classList.add('hidden');
    });

    document.getElementById('closeProfileForm').addEventListener('click', () => {
    document.getElementById('manageProfileForm').classList.add('hidden');
    });
    
    
    document.getElementById('profileForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const formData = new FormData(this);
    
        // Handles the updating of a current profile.
        fetch('../userProfile.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Profile updated successfully');
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => console.error('Error updating profile:', error));
        });
        
        document.getElementById('cancelButton').addEventListener('click', () => {
            document.getElementById('fullName').readOnly = true;
            document.getElementById('email').readOnly = true;
            document.getElementById('role').readOnly = true;
            document.getElementById('location').readOnly = true;
            document.getElementById('saveButton').classList.add('hidden');
            document.getElementById('cancelButton').classList.add('hidden');
            document.getElementById('editButton').classList.remove('hidden');
        }); 
    </script>
</body>
</html>
